apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-
namespace: devops-lab-staging

patches:
  - target:
      kind: Deployment
      name: web-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: ConfigMap
      name: web-app-config
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: staging
  - target:
      kind: Ingress
      name: web-app
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging.web-app.local

images:
  - name: nginx
    newTag: 1.25-alpine
